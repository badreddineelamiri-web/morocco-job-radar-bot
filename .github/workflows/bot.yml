name: Morocco Job Radar Bot

on:
  schedule:
    # Run all day. Each run publishes at most one accepted job.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without publishing to Facebook'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      max_jobs:
        description: 'Maximum jobs to publish or simulate'
        required: true
        default: '4'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'

permissions:
  contents: write

concurrency:
  group: morocco-job-radar-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-ui-core fonts-noto-color-emoji

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test image, post, and dry-run publish
        env:
          PYTHONIOENCODING: utf-8
          DRY_RUN: 'true'
        run: python test_system.py

      - name: Resolve runtime mode
        id: runtime
        env:
          REQUESTED_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          dry_run="${REQUESTED_DRY_RUN:-false}"
          if [ "$dry_run" != "true" ] && { [ -z "$FACEBOOK_PAGE_ID" ] || [ -z "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; }; then
            echo "::warning::Facebook secrets are missing; running in DRY_RUN mode. Add FACEBOOK_PAGE_ID and FACEBOOK_PAGE_ACCESS_TOKEN repository secrets for live publishing."
            dry_run="true"
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Run bot
        env:
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ steps.runtime.outputs.dry_run }}
          REQUEST_TIMEOUT: 20
          GOV_MAX_ITEMS_PER_SOURCE: 4
          MAX_JOBS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_jobs || '1' }}

          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_FINAL_PROVIDER_ORDER: ${{ vars.AI_FINAL_PROVIDER_ORDER }}
          AI_TASK_SUMMARY_PROVIDER_ORDER: ${{ vars.AI_TASK_SUMMARY_PROVIDER_ORDER }}
          AI_TASK_TRANSLATION_PROVIDER_ORDER: ${{ vars.AI_TASK_TRANSLATION_PROVIDER_ORDER }}
          AI_TASK_REWRITE_PROVIDER_ORDER: ${{ vars.AI_TASK_REWRITE_PROVIDER_ORDER }}
          AI_TASK_SEO_PROVIDER_ORDER: ${{ vars.AI_TASK_SEO_PROVIDER_ORDER }}
          AI_TASK_HTML_PROVIDER_ORDER: ${{ vars.AI_TASK_HTML_PROVIDER_ORDER }}
          AI_TASK_FACEBOOK_PROVIDER_ORDER: ${{ vars.AI_TASK_FACEBOOK_PROVIDER_ORDER }}
          AI_MAX_MODELS_PER_PROVIDER: ${{ vars.AI_MAX_MODELS_PER_PROVIDER }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}

          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_MODEL: ${{ vars.COHERE_MODEL }}
          COHERE_MODELS: ${{ vars.COHERE_MODELS }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}

          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          HUGGINGFACE_MODEL: ${{ vars.HUGGINGFACE_MODEL }}
          HUGGINGFACE_MODELS: ${{ vars.HUGGINGFACE_MODELS }}

          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          MISTRAL_MODELS: ${{ vars.MISTRAL_MODELS }}

          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          NVIDIA_MODELS: ${{ vars.NVIDIA_MODELS }}

          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TOGETHER_MODEL: ${{ vars.TOGETHER_MODEL }}
          TOGETHER_MODELS: ${{ vars.TOGETHER_MODELS }}

          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit published jobs tracker
        if: success() && steps.runtime.outputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published_jobs.json state/jobs_sources_state.json
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            git commit -m "[bot] update published jobs tracker [skip ci]"
            git push
          fi

      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-images
          path: data/generated_images/
          retention-days: 7
          if-no-files-found: ignore
