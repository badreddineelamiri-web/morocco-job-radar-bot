name: Morocco Job Radar Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morocco-job-radar-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ secrets.DRY_RUN }}
          GOV_MAX_ITEMS_PER_SOURCE: 2
          MAX_JOBS_PER_RUN: 3

          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_FINAL_PROVIDER_ORDER: ${{ secrets.AI_FINAL_PROVIDER_ORDER }}
          AI_TASK_SUMMARY_PROVIDER_ORDER: ${{ secrets.AI_TASK_SUMMARY_PROVIDER_ORDER }}
          AI_TASK_TRANSLATION_PROVIDER_ORDER: ${{ secrets.AI_TASK_TRANSLATION_PROVIDER_ORDER }}
          AI_TASK_REWRITE_PROVIDER_ORDER: ${{ secrets.AI_TASK_REWRITE_PROVIDER_ORDER }}
          AI_TASK_SEO_PROVIDER_ORDER: ${{ secrets.AI_TASK_SEO_PROVIDER_ORDER }}
          AI_TASK_HTML_PROVIDER_ORDER: ${{ secrets.AI_TASK_HTML_PROVIDER_ORDER }}
          AI_TASK_FACEBOOK_PROVIDER_ORDER: ${{ secrets.AI_TASK_FACEBOOK_PROVIDER_ORDER }}
          AI_MAX_MODELS_PER_PROVIDER: ${{ secrets.AI_MAX_MODELS_PER_PROVIDER }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}

          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}

          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_MODEL: ${{ secrets.COHERE_MODEL }}
          COHERE_MODELS: ${{ secrets.COHERE_MODELS }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GROQ_MODELS: ${{ secrets.GROQ_MODELS }}

          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          HUGGINGFACE_MODEL: ${{ secrets.HUGGINGFACE_MODEL }}
          HUGGINGFACE_MODELS: ${{ secrets.HUGGINGFACE_MODELS }}

          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}
          MISTRAL_MODELS: ${{ secrets.MISTRAL_MODELS }}

          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          NVIDIA_MODELS: ${{ secrets.NVIDIA_MODELS }}

          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          TOGETHER_MODEL: ${{ secrets.TOGETHER_MODEL }}
          TOGETHER_MODELS: ${{ secrets.TOGETHER_MODELS }}

          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit published jobs tracker
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published_jobs.json
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            git commit -m "[bot] update published jobs tracker [skip ci]"
            git push
          fi

      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-images
          path: data/generated_images/
          retention-days: 7
          if-no-files-found: ignore
